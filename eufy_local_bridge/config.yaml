name: Eufy Local Bridge T9000
version: "1.4.1"
slug: eufy_local_bridge
url: https://github.com/TheUncas/ha-eufy-t9000
description: Connecte Home Assistant à la HomeBase T9000 pour les batteries, l’alarme et les caméras.
arch:
  - amd64
startup: services
boot: auto
host_network: true
privileged:
  - NET_RAW
tmpfs: true
init: true
timeout: 30
map:
  - type: homeassistant_config
    read_only: false
    path: /opt/eufy-install/homeassistant
options:
  pairing_key: ""
  state_poll_seconds: 10
  station_poll_seconds: 30
  camera_start_timeout_seconds: 30
  poe_snapshots_enabled: false
  poe_snapshot_interval_seconds: 60
schema:
  pairing_key: password
  state_poll_seconds: int(5,120)
  station_poll_seconds: int(15,120)
  camera_start_timeout_seconds: int(15,60)
  poe_snapshots_enabled: bool
  poe_snapshot_interval_seconds: int(30,3600)
